name: placetrack-prod

services:
  db:
    image: postgres:16-alpine
    container_name: placetrack-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placetrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placetrack_pass}
      POSTGRES_DB: ${POSTGRES_DB:-placetrack_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placetrack} -d ${POSTGRES_DB:-placetrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placetrack-prod-backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-placetrack}:${POSTGRES_PASSWORD:-placetrack_pass}@db:5432/${POSTGRES_DB:-placetrack_db}
      JWT_SECRET: ${JWT_SECRET:-production-secret-must-be-set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@placetrack.edu}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: placetrack-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PROD_PORT:-80}:80"

volumes:
  pgdata_prod:
