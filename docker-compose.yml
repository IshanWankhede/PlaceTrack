name: placetrack

services:
  # ------------------------------------------------------------------ DATABASE
  db:
    image: postgres:16-alpine
    container_name: placetrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5433}:5432"          # pgAdmin on your PC -> localhost:5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on the FIRST start with an empty volume, in filename order:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ DEV MAIL CATCHER (OTP e-mails)
  mailpit:
    image: axllent/mailpit:latest
    container_name: placetrack-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"      # web inbox: http://localhost:8025
    # SMTP listens on 1025 inside the compose network only

  # ------------------------------------------------------------------ BACKEND
  backend:
    build: ./backend
    container_name: placetrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SMTP_HOST: mailpit               # dev mail catcher, see http://localhost:8025
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@placetrack.local}
      WATCHFILES_FORCE_POLLING: "true"   # makes --reload work on Windows/macOS bind mounts
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app                   # live code: edit on host -> uvicorn --reload picks it up

  # ------------------------------------------------------------------ FRONTEND
  frontend:
    build: ./frontend
    container_name: placetrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      CHOKIDAR_USEPOLLING: "true"        # file-watch polling for Windows/macOS
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app                  # live code: Vite HMR updates the browser instantly
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:

